<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="p4Hero" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="p4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#p4Bg)" rx="8" />

  <!-- Streamlit App Top Navigation Bar -->
  <rect width="800" height="42" fill="#1e293b" />
  <circle cx="20" cy="21" r="5" fill="#f87171" />
  <circle cx="36" cy="21" r="5" fill="#fbbf24" />
  <circle cx="52" cy="21" r="5" fill="#34d399" />
  
  <!-- Browser Address Bar -->
  <rect x="180" y="8" width="440" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="400" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">🔒 diabetesriskpred.streamlit.app</text>
  
  <!-- Streamlit Crown Logo Badge -->
  <g transform="translate(710, 11)">
    <rect width="70" height="20" rx="10" fill="rgba(255, 75, 75, 0.15)" stroke="rgba(255, 75, 75, 0.4)" stroke-width="1" />
    <text x="35" y="14" fill="#ff4b4b" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">Streamlit</text>
  </g>

  <!-- App Hero Header -->
  <g transform="translate(24, 54)">
    <rect width="752" height="65" rx="12" fill="url(#p4Hero)" />
    <text x="24" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">🩺 Diabetes Risk Predictor By Pushpender</text>
    <text x="24" y="52" fill="rgba(255,255,255,0.9)" font-family="-apple-system, sans-serif" font-size="12">Supervised Clinical Machine Learning Model powered by XGBoost &amp; Scikit-Learn</text>
    <rect x="620" y="16" width="112" height="32" rx="16" fill="rgba(0,0,0,0.25)" />
    <text x="676" y="36" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ROC-AUC: 0.94</text>
  </g>

  <!-- Main Body Content: Two Columns -->
  <!-- Left Column: Patient Parameters Form -->
  <g transform="translate(24, 130)">
    <rect width="360" height="345" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Patient Clinical Metrics</text>
    <line x1="20" y1="38" x2="340" y2="38" stroke="#1e293b" stroke-width="1" />

    <!-- Param 1: Blood Glucose Level -->
    <g transform="translate(20, 52)">
      <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11">Blood Glucose Level</text>
      <text x="320" y="12" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">154 mg/dL</text>
      <rect x="0" y="20" width="320" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="20" width="220" height="6" rx="3" fill="#06b6d4" />
    </g>

    <!-- Param 2: HbA1c Level -->
    <g transform="translate(20, 96)">
      <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11">HbA1c Concentration</text>
      <text x="320" y="12" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">6.8 % (Elevated)</text>
      <rect x="0" y="20" width="320" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="20" width="235" height="6" rx="3" fill="#f43f5e" />
    </g>

    <!-- Param 3: Body Mass Index (BMI) -->
    <g transform="translate(20, 140)">
      <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11">Body Mass Index (BMI)</text>
      <text x="320" y="12" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">29.4 kg/m²</text>
      <rect x="0" y="20" width="320" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="20" width="190" height="6" rx="3" fill="#fbbf24" />
    </g>

    <!-- Param 4: Age -->
    <g transform="translate(20, 184)">
      <text x="0" y="12" fill="#94a3b8" font-family="sans-serif" font-size="11">Age</text>
      <text x="320" y="12" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">48 Years</text>
      <rect x="0" y="20" width="320" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="20" width="150" height="6" rx="3" fill="#8b5cf6" />
    </g>

    <!-- Param 5: Toggles (Hypertension & Smoking) -->
    <g transform="translate(20, 230)">
      <rect x="0" y="0" width="150" height="34" rx="6" fill="#1e293b" />
      <text x="12" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="11">Hypertension: <tspan fill="#f87171" font-weight="700">Yes</tspan></text>

      <rect x="165" y="0" width="155" height="34" rx="6" fill="#1e293b" />
      <text x="177" y="21" fill="#e2e8f0" font-family="sans-serif" font-size="11">Smoking: <tspan fill="#fbbf24" font-weight="700">Former</tspan></text>
    </g>

    <!-- Predict Action Button -->
    <g transform="translate(20, 280)">
      <rect width="320" height="42" rx="8" fill="url(#p4Hero)" />
      <text x="160" y="26" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">⚡ Re-calculate Diagnostic Prediction</text>
    </g>
  </g>

  <!-- Right Column: Model Output & Probability Dial -->
  <g transform="translate(400, 130)">
    <rect width="376" height="345" rx="12" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">Probabilistic Risk Output</text>
    <line x1="20" y1="38" x2="356" y2="38" stroke="#1e293b" stroke-width="1" />

    <!-- Big Gauge Dial -->
    <g transform="translate(188, 125)">
      <!-- Semicircle Track -->
      <path d="M -110 0 A 110 110 0 0 1 110 0" fill="none" stroke="#1e293b" stroke-width="18" stroke-linecap="round" />
      <path d="M -110 0 A 110 110 0 0 1 65 -88" fill="none" stroke="url(#gaugeGrad)" stroke-width="18" stroke-linecap="round" filter="url(#p4Glow)" />
      
      <!-- Needle -->
      <polygon points="0,8 -5,-80 5,-80" fill="#f8fafc" transform="rotate(45)" />
      <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#fff" stroke-width="3" />

      <!-- Center Percent Score -->
      <text x="0" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle">74.8%</text>
      <text x="0" y="50" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">HIGH RISK PROFILE</text>
    </g>

    <!-- Alert Box -->
    <g transform="translate(20, 215)">
      <rect width="336" height="48" rx="8" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1" />
      <text x="16" y="24" fill="#fca5a5" font-family="sans-serif" font-size="12" font-weight="700">⚠️ Elevated Risk Detected</text>
      <text x="16" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Top contributors: HbA1c (6.8%) and Blood Glucose (154 mg/dL)</text>
    </g>

    <!-- Bottom Model Metadata Badges -->
    <g transform="translate(20, 280)">
      <rect width="102" height="34" rx="6" fill="#1e293b" />
      <text x="51" y="21" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Balanced XGB</text>

      <rect x="112" y="0" width="106" height="34" rx="6" fill="#1e293b" />
      <text x="165" y="21" fill="#34d399" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Accuracy: 96.2%</text>

      <rect x="228" y="0" width="108" height="34" rx="6" fill="#1e293b" />
      <text x="282" y="21" fill="#a78bfa" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">F1-Score: 0.91</text>
    </g>
  </g>
</svg>
