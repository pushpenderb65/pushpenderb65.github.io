<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="p5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="movieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="poster1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="poster2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="poster3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
    <linearGradient id="poster4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#p5Bg)" rx="8" />

  <!-- App Header Bar -->
  <rect width="800" height="42" fill="#1e293b" />
  <circle cx="20" cy="21" r="5" fill="#f87171" />
  <circle cx="36" cy="21" r="5" fill="#fbbf24" />
  <circle cx="52" cy="21" r="5" fill="#34d399" />

  <!-- Streamlit App Title in Nav -->
  <text x="80" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">🎬 Movie Recommender — Streamlit &amp; FastAPI</text>
  
  <g transform="translate(640, 11)">
    <rect width="140" height="20" rx="10" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
    <text x="70" y="14" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">Cosine Similarity</text>
  </g>

  <!-- Search / Input Section -->
  <g transform="translate(24, 56)">
    <rect width="752" height="74" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">Select or Search a Film to Generate Similarity Recommendations</text>
    
    <!-- Search Bar with Query -->
    <rect x="20" y="32" width="560" height="34" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="32" y="54" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="600">🍿 Inception (2010) — Christopher Nolan</text>
    
    <!-- Recommend CTA Button -->
    <rect x="590" y="32" width="142" height="34" rx="6" fill="url(#movieGrad)" />
    <text x="661" y="54" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Recommend ➔</text>
  </g>

  <!-- Selected Film Info Pill Row -->
  <g transform="translate(24, 140)">
    <text x="4" y="16" fill="#94a3b8" font-family="sans-serif" font-size="11">Selected Metadata:</text>
    
    <rect x="120" y="0" width="110" height="24" rx="12" fill="rgba(255,255,255,0.06)" />
    <text x="175" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Sci-Fi / Action</text>

    <rect x="240" y="0" width="85" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
    <text x="282" y="16" fill="#fbbf24" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">★ 8.8 / 10</text>

    <rect x="335" y="0" width="165" height="24" rx="12" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <text x="417" y="16" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">TMDB 5,000 Vector Space</text>

    <text x="752" y="16" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="end">4 Closest Neighbors</text>
  </g>

  <!-- 4 Recommended Film Cards Grid -->
  <g transform="translate(24, 178)">
    
    <!-- Card 1: Interstellar -->
    <g transform="translate(0, 0)">
      <rect width="176" height="300" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <!-- Poster -->
      <rect x="10" y="10" width="156" height="180" rx="8" fill="url(#poster1)" />
      <text x="88" y="90" fill="#a5b4fc" font-family="sans-serif" font-size="28" text-anchor="middle">🌌</text>
      <text x="88" y="125" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Interstellar</text>
      <text x="88" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">2014 • Sci-Fi</text>
      
      <!-- Match Badge -->
      <rect x="10" y="200" width="156" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <text x="88" y="216" fill="#10b981" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">94.6% Similarity</text>

      <!-- Details -->
      <text x="14" y="244" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="600">Dir: C. Nolan</text>
      <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Shared vector themes</text>
      <text x="14" y="282" fill="#fbbf24" font-family="sans-serif" font-size="10">★★★★☆ 8.7</text>
    </g>

    <!-- Card 2: The Matrix -->
    <g transform="translate(192, 0)">
      <rect width="176" height="300" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <!-- Poster -->
      <rect x="10" y="10" width="156" height="180" rx="8" fill="url(#poster2)" />
      <text x="88" y="90" fill="#6ee7b7" font-family="sans-serif" font-size="28" text-anchor="middle">🕶️</text>
      <text x="88" y="125" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">The Matrix</text>
      <text x="88" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">1999 • Cyberpunk</text>
      
      <!-- Match Badge -->
      <rect x="10" y="200" width="156" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
      <text x="88" y="216" fill="#10b981" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">91.2% Similarity</text>

      <!-- Details -->
      <text x="14" y="244" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="600">Dir: Wachowskis</text>
      <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Mind-bending reality</text>
      <text x="14" y="282" fill="#fbbf24" font-family="sans-serif" font-size="10">★★★★☆ 8.7</text>
    </g>

    <!-- Card 3: Shutter Island -->
    <g transform="translate(384, 0)">
      <rect width="176" height="300" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <!-- Poster -->
      <rect x="10" y="10" width="156" height="180" rx="8" fill="url(#poster3)" />
      <text x="88" y="90" fill="#f0abfc" font-family="sans-serif" font-size="28" text-anchor="middle">🗼</text>
      <text x="88" y="125" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Shutter Island</text>
      <text x="88" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">2010 • Mystery</text>
      
      <!-- Match Badge -->
      <rect x="10" y="200" width="156" height="24" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <text x="88" y="216" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">88.5% Similarity</text>

      <!-- Details -->
      <text x="14" y="244" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="600">Star: L. DiCaprio</text>
      <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Psychological thriller</text>
      <text x="14" y="282" fill="#fbbf24" font-family="sans-serif" font-size="10">★★★★☆ 8.2</text>
    </g>

    <!-- Card 4: Memento -->
    <g transform="translate(576, 0)">
      <rect width="176" height="300" rx="10" fill="#131d2e" stroke="#1e293b" stroke-width="1" />
      <!-- Poster -->
      <rect x="10" y="10" width="156" height="180" rx="8" fill="url(#poster4)" />
      <text x="88" y="90" fill="#fdba74" font-family="sans-serif" font-size="28" text-anchor="middle">🧩</text>
      <text x="88" y="125" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Memento</text>
      <text x="88" y="142" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">2000 • Neo-Noir</text>
      
      <!-- Match Badge -->
      <rect x="10" y="200" width="156" height="24" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1" />
      <text x="88" y="216" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="800" text-anchor="middle">86.4% Similarity</text>

      <!-- Details -->
      <text x="14" y="244" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="600">Dir: C. Nolan</text>
      <text x="14" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Non-linear narrative</text>
      <text x="14" y="282" fill="#fbbf24" font-family="sans-serif" font-size="10">★★★★☆ 8.4</text>
    </g>
  </g>
</svg>
